        proofPhotoUrl: { type: ["string", "null"] }
        signatureData: { type: ["string", "null"] }
        receiverName: { type: ["string", "null"] }

    DashboardStats:
      type: object
      required: [totalRequests, pendingRequests, inProgressRequests, completedRequests, cancelledRequests, totalConversations, openConversations, unreadNotifications, todayRequests, yesterdayRequests, weekRequests, scheduledRequests, completionRate, dailyTrend, serviceBreakdown, statusDistribution, recentRequests, recentNotifications]
      properties:
        totalRequests: { type: integer }
        pendingRequests: { type: integer }
        inProgressRequests: { type: integer }
        completedRequests: { type: integer }
        cancelledRequests: { type: integer }
        totalConversations: { type: integer }
        openConversations: { type: integer }
        unreadNotifications: { type: integer }
        todayRequests: { type: integer }
        yesterdayRequests: { type: integer }
        weekRequests: { type: integer }
        scheduledRequests: { type: integer }
        completionRate: { type: integer }
        dailyTrend:
          type: array
          items:
            type: object
            required: [day, date, total, completed]
