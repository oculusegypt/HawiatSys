openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Taqi Group API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: content
  - name: services
  - name: chat
  - name: notifications
  - name: admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ─────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  # ── Hero Slides ───────────────────────────────────────────────────────────
  /slides:
    get:
      operationId: getSlides
      tags: [content]
      summary: List hero slides
      responses:
        "200":
          description: List of slides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeroSlide"
    post:
      operationId: createSlide
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeroSlideInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroSlide"

  /slides/{id}:
    patch:
      operationId: updateSlide
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeroSlideInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroSlide"
    delete:
      operationId: deleteSlide
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Services ──────────────────────────────────────────────────────────────
  /services:
    get:
      operationId: getServices
      tags: [content]
      summary: List services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /services/{id}:
    patch:
      operationId: updateService
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Containers ────────────────────────────────────────────────────────────
  /containers:
    get:
      operationId: getContainers
      tags: [content]
      summary: List container types
      responses:
        "200":
          description: List of containers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Container"
    post:
      operationId: createContainer
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"

  /containers/{id}:
    patch:
      operationId: updateContainer
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Container"
    delete:
      operationId: deleteContainer
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Values ────────────────────────────────────────────────────────────────
  /values:
    get:
      operationId: getValues
      tags: [content]
      summary: List company values
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyValue"
    post:
      operationId: createValue
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyValueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyValue"

  /values/{id}:
    patch:
      operationId: updateValue
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyValueInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyValue"
    delete:
      operationId: deleteValue
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Testimonials ──────────────────────────────────────────────────────────
  /testimonials:
    get:
      operationId: getTestimonials
      tags: [content]
      summary: List testimonials
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"

  /testimonials/{id}:
    patch:
      operationId: updateTestimonial
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteTestimonial
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Partners ──────────────────────────────────────────────────────────────
  /partners:
    get:
      operationId: getPartners
      tags: [content]
      summary: List partners
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partners/{id}:
    patch:
      operationId: updatePartner
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
    delete:
      operationId: deletePartner
      tags: [content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Service Requests ──────────────────────────────────────────────────────
  /service-requests:
    get:
      operationId: getServiceRequests
      tags: [services]
      summary: List all service requests (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"
    post:
      operationId: submitServiceRequest
      tags: [services]
      summary: Submit a new service request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  /service-requests/{id}:
    get:
      operationId: getServiceRequest
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Service request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
    patch:
      operationId: updateServiceRequest
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
    delete:
      operationId: deleteServiceRequest
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /service-requests/{id}/assignment:
    patch:
      operationId: assignServiceRequest
      tags: [services]
      summary: Assign a service request to a driver (admin or manager)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestAssignment"
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  /driver/work-orders:
    get:
      operationId: getDriverWorkOrders
      tags: [services]
      summary: List work orders assigned to the current driver
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DriverWorkOrderStatus"
      responses:
        "200":
          description: Driver work orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"

  /driver/work-orders/{id}:
    patch:
      operationId: updateDriverWorkOrder
      tags: [services]
      summary: Accept, reject, start, travel, arrive, or complete a driver's work order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverWorkOrderUpdate"
      responses:
        "200":
          description: Work order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  /admin/work-orders:
    get:
      operationId: getAdminWorkOrders
      tags: [admin]
      summary: List current work orders for managers
      responses:
        "200":
          description: Current work orders assigned to drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRequest"

  # ── Dashboard Stats ───────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard summary statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Chat / Conversations ──────────────────────────────────────────────────
  /conversations:
    get:
      operationId: getConversations
      tags: [chat]
      summary: List conversations (admin)
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start a new conversation (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [chat]
      summary: Get a conversation for its participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
    patch:
      operationId: updateConversation
      tags: [chat]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [chat]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chat]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/{id}/typing:
    post:
      operationId: setConversationTyping
      tags: [chat]
      summary: Update typing presence for a conversation participant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationTypingInput"
      responses:
        "200":
          description: Typing state updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, isTyping]
                properties:
                  ok: { type: boolean }
                  isTyping: { type: boolean }

  # ── AI Chatbot ────────────────────────────────────────────────────────────
  /ai/chat:
    post:
      operationId: aiChat
      tags: [chat]
      summary: Send message to AI assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotReply"

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  # ── SEO landing pages ───────────────────────────────────────────────────────
  /pages:
    get:
      operationId: getSeoPages
      tags: [content]
      summary: List published SEO landing pages
      responses:
        "200":
          description: Published pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeoPage"

  /pages/{slug}:
    get:
      operationId: getSeoPage
      tags: [content]
      summary: Get a published SEO landing page
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: SEO landing page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoPage"
        "404":
          description: Not found

  /admin/seo-pages:
    get:
      operationId: getAdminSeoPages
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All SEO landing pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeoPage"
    post:
      operationId: createSeoPage
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoPageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoPage"

  /admin/seo-pages/{id}:
    patch:
      operationId: updateSeoPage
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeoPageInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoPage"
    delete:
      operationId: deleteSeoPage
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  # ── Web Push ─────────────────────────────────────────────────────────────
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifications]
      summary: Get the VAPID public key for the signed-in admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
        "401":
          description: Unauthorized
        "503":
          description: Push notifications are not configured

  /push/subscriptions:
    post:
      operationId: savePushSubscription
      tags: [notifications]
      summary: Save the current browser push subscription for the signed-in admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"
    delete:
      operationId: deletePushSubscription
      tags: [notifications]
      summary: Remove the current browser push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionDeleteInput"
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResult"

  # ── Full container rental system ──────────────────────────────────────────
  /admin/container-system:
    get:
      operationId: getContainerSystem
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Container system snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerSystemSnapshot"

  /admin/container-system/records:
    get:
      operationId: getContainerSystemRecords
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Container system records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerSystemRecord"

    post:
      operationId: createContainerSystemRecord
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerSystemRecordInput"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerSystemRecord"

  /admin/container-system/contracts/workflow:
    post:
      operationId: createContainerContractWorkflow
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerContractWorkflowInput"
      responses:
        "201":
          description: Contract workflow created atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerContractWorkflowResult"

  /admin/container-system/records/{id}:
    patch:
      operationId: updateContainerSystemRecord
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerSystemRecordUpdate"
      responses:
        "200":
          description: Record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerSystemRecord"
    delete:
      operationId: archiveContainerSystemRecord
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Record archived

  /admin/container-system/audit:
    get:
      operationId: getContainerSystemAudit
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContainerSystemAudit"

  /admin/container-system/financial/contract-ledgers:
    get:
      operationId: getContainerContractLedgers
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: contractId
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Contract statements with collections and deposits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractLedgerResponse"

  /admin/container-system/financial/core:
    get:
      operationId: getFinancialTruth
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Single source of truth for posted financial results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTruthResponse"

  /admin/container-system/financial/settle:
    post:
      operationId: settleContainerContract
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractSettlementInput"
      responses:
        "201":
          description: Collection recorded and linked to the contract statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSettlementResult"
        "200":
          description: Existing collection returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSettlementResult"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: admin-token

  schemas:
    ContainerSystemRecord:
      type: object
      required: [id, kind, status, reference, payload, createdAt, updatedAt]
      properties:
        id: { type: integer }
        kind: { type: string }
        status: { type: string }
        reference: { type: string }
        payload:
          type: object
          additionalProperties: true
        createdBy: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    FinancialTruthTotals:
      type: object
      required: [revenue, collected, receivables, expenses, purchases, inventory, commissions, bankFees, refunds, transfers, cashBalance, bankBalance, netProfit, balances, grossRevenue, grossCollections, netCollections, returnedCollections, deposits, totalDebit, totalCredit]
      properties:
        revenue: { type: number }
        collected: { type: number }
        receivables: { type: number }
        expenses: { type: number }
        purchases: { type: number }
        inventory: { type: number }
        commissions: { type: number }
        bankFees: { type: number }
        refunds: { type: number }
        transfers: { type: number }
        cashBalance: { type: number }
        bankBalance: { type: number }
        netProfit: { type: number }
        grossRevenue: { type: number }
        grossCollections: { type: number }
        netCollections: { type: number }
        returnedCollections: { type: number }
        deposits: { type: number }
        totalDebit: { type: number }
        totalCredit: { type: number }
        balances:
          type: object
          required: [accountsReceivable, accountsPayable, cash, bank, inventory]
          properties:
            accountsReceivable: { type: number }
            accountsPayable: { type: number }
            cash: { type: number }
            bank: { type: number }
            inventory: { type: number }

    FinancialTruthResponse:
      type: object
      required: [totals, counts]
      properties:
        totals:
          $ref: "#/components/schemas/FinancialTruthTotals"
        counts:
          type: array
          items:
            type: object
            required: [kind, count]
            properties:
              kind: { type: string }
              count: { type: integer }

    ContainerSystemRecordInput:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string }
        status: { type: string }
        payload:
          type: object
          additionalProperties: true

    ContainerSystemRecordUpdate:
      type: object
      properties:
        status: { type: string }
        payload:
          type: object
          additionalProperties: true

    ContainerContractWorkflowInput:
      type: object
      required: [contract, assignment, appointment]
      properties:
        operationKey:
          type: string
          minLength: 8
          maxLength: 160
        contract:
          type: object
          additionalProperties: true
        assignment:
          type: object
          additionalProperties: true
        appointment:
          type: object
          additionalProperties: true
        serviceRequest:
          type: object
          additionalProperties: true
        workOrder:
          $ref: "#/components/schemas/ContainerSystemRecord"

    ContainerContractWorkflowResult:
      type: object
      required: [contract, assignment, appointment]
      properties:
        contract:
          $ref: "#/components/schemas/ContainerSystemRecord"
        assignment:
          $ref: "#/components/schemas/ContainerSystemRecord"
        appointment:
          $ref: "#/components/schemas/ContainerSystemRecord"
        serviceRequest:
          type: object
          additionalProperties: true
        workOrder:
          $ref: "#/components/schemas/ContainerSystemRecord"

    ContainerSystemAudit:
      type: object
      required: [id, kind, action, createdAt]
      properties:
        id: { type: integer }
        recordId: { type: ["integer", "null"] }
        kind: { type: string }
        action: { type: string }
        beforePayload: { type: ["string", "null"] }
        afterPayload: { type: ["string", "null"] }
        actorId: { type: ["integer", "null"] }
        createdAt: { type: string }

    ContainerSystemSummary:
      type: object
      additionalProperties: true

    ContainerSystemSnapshot:
      type: object
      required: [summary, records, expiringContracts, recent]
      properties:
        summary:
          $ref: "#/components/schemas/ContainerSystemSummary"
        records:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSystemRecord"
        expiringContracts:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSystemRecord"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSystemRecord"

    ContractLedgerRow:
      type: object
      required: [contract, total, collected, deposited, remaining, deposits, payments]
      properties:
        contract:
          $ref: "#/components/schemas/ContainerSystemRecord"
        total: { type: number }
        collected: { type: number }
        deposited: { type: number }
        remaining: { type: number }
        deposits:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSystemRecord"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/ContainerSystemRecord"

    ContractLedgerResponse:
      type: object
      required: [ledgers, totals]
      properties:
        ledgers:
          type: array
          items:
            $ref: "#/components/schemas/ContractLedgerRow"
        totals:
          type: object
          required: [contractValue, collected, deposited, remaining]
          properties:
            contractValue: { type: number }
            collected: { type: number }
            deposited: { type: number }
            remaining: { type: number }

    ContractSettlementInput:
      type: object
      required: [amount, paymentMethod, operationKey]
      properties:
        contractId: { type: integer, description: Legacy single-contract shortcut; allocations is preferred }
        invoiceId: { type: ["integer", "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        paymentMethod: { type: string }
        operationKey: { type: string, minLength: 8, maxLength: 160 }
        depositId: { type: ["integer", "null"] }
        date: { type: string }
        notes: { type: string }
        allocations:
          type: array
          minItems: 1
          items:
            type: object
            required: [contractId, amount]
            properties:
              contractId: { type: integer }
              amount: { type: number, exclusiveMinimum: 0 }
              invoiceId: { type: ["integer", "null"] }

    ContractSettlementResult:
      type: object
      required: [payment, ledgerEntry, idempotent]
      properties:
        payment:
          $ref: "#/components/schemas/ContainerSystemRecord"
        ledgerEntry:
          $ref: "#/components/schemas/ContainerSystemRecord"
        idempotent: { type: boolean }

    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    SuccessResult:
      type: object
      properties:
        success: { type: boolean }
      required: [success]

    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string }

    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    PushSubscriptionDeleteInput:
      type: object
      properties:
        endpoint: { type: string }

    LoginInput:
      type: object
